# Local stack for the API: PostgreSQL + API
#   docker compose up --build
#   → API http://localhost:4000   Postgres localhost:5432 (postgres / postgres)
# Optional: export MISTRAL_API_KEY=... before running to use the real LLM.
# The web app is a separate project (slotwise-frontend).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slotwise
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d slotwise']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/slotwise
      JWT_SECRET: local-docker-secret-change-me-0123456789abcdef
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
